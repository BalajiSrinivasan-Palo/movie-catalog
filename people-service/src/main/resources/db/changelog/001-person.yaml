databaseChangeLog:
  - changeSet:
      id: 001-person
      author: movie-catalog
      changes:
        - createTable:
            tableName: person
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: name_key, type: varchar(200), constraints: { nullable: false } }
              - column: { name: birth_date, type: date }
              - column: { name: bio, type: varchar(2000), defaultValue: "", constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: person
            indexName: idx_person_name_key
            columns:
              - column: { name: name_key }
