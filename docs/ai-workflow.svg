<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" width="1280" height="950" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Claude Code was used to build Movie Catalog</title>
  <desc id="d">The Technical Assessment PDF is analysed into an assessment analysis, then BRD and NFR, architecture with ADRs, the backlog and refinement, with the owner approving each step in the decisions log. Each story then runs a three-agent pipeline coordinated by the main session: story-planner writes the plan and the owner approves it; backend-implementer or frontend-implementer builds it and writes an implementation report, and the owner runs the backend Gradle commands; reviewer and security-reviewer check the code against the story and the plan and write a review with a verdict, and the owner picks which findings to fix, which go back to the build step; an approved review with evidence marks the story done. An agent is started by an at-mention, by naming it in a message, or automatically when the task matches its description. Guardrails apply throughout: CLAUDE.md rules, a PreToolUse hook, a pre-commit hook and the traceability check.</desc>
