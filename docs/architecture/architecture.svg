<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Movie Catalog architecture</title>
  <desc id="d">A user's browser loads the SvelteKit frontend on port 5173. The frontend sends GraphQL and artwork requests to the api-gateway on port 8080. The gateway calls movie-service on gRPC port 9091 and people-service on gRPC port 9092. people-service asks movie-service over gRPC whether a person still has credits. movie-service stores movies and credits in an H2 database and poster files on disk; people-service stores people in its own H2 database.</desc>
  <defs>
    <marker id="arrow-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="arrow-grpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="640" rx="24" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#0F172A">Movie Catalog</text>
  <text x="40" y="80" font-size="15" fill="#64748B">A browser app, one GraphQL gateway, and two gRPC services that each own their data</text>

  <!-- user -->
  <circle cx="110" cy="320" r="54" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <circle cx="110" cy="304" r="16" fill="#4F46E5"/>
  <path d="M78 352 C78 330 92 322 110 322 C128 322 142 330 142 352 Z" fill="#4F46E5"/>
  <text x="110" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">User</text>
  <text x="110" y="422" text-anchor="middle" font-size="13" fill="#64748B">web browser</text>

  <!-- user → frontend -->
  <line x1="168" y1="320" x2="246" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-http)"/>
  <text x="207" y="306" text-anchor="middle" font-size="12" fill="#475569">HTTP</text>

  <!-- frontend -->
  <g filter="url(#shadow)">
    <rect x="252" y="236" width="196" height="168" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  </g>
  <rect x="330" y="252" width="40" height="27" rx="5" fill="none" stroke="#059669" stroke-width="2.5"/>
  <line x1="350" y1="279" x2="350" y2="286" stroke="#059669" stroke-width="2.5"/>
  <line x1="340" y1="287" x2="360" y2="287" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <text x="350" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#064E3B">Frontend</text>
  <text x="350" y="335" text-anchor="middle" font-size="13" fill="#065F46">SvelteKit SPA · TypeScript</text>
  <rect x="295" y="347" width="110" height="24" rx="12" fill="#10B981"/>
  <text x="350" y="364" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">localhost:5173</text>
  <text x="350" y="391" text-anchor="middle" font-size="11.5" fill="#047857">Vite in dev · static files when built</text>


  <!-- backend boundary -->
  <rect x="540" y="116" width="712" height="452" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="566" y="146" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">BACKEND · KOTLIN · SPRING BOOT · JDK 21</text>
  <!-- frontend → gateway: drawn after the backend box so the line and its labels sit on top -->
  <line x1="448" y1="320" x2="566" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-http)"/>
  <text x="507" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">GraphQL /graphql</text>
  <text x="507" y="343" text-anchor="middle" font-size="12" fill="#475569">GET /artwork/*</text>

  <!-- gateway -->
  <g filter="url(#shadow)">
    <rect x="572" y="226" width="200" height="188" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <circle cx="657" cy="262" r="6" fill="#7C3AED"/>
  <path d="M663 262 H674 M674 262 C682 262 682 250 690 250 M674 262 C682 262 682 274 690 274" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="694" cy="250" r="4.5" fill="#7C3AED"/>
  <circle cx="694" cy="274" r="4.5" fill="#7C3AED"/>
  <text x="672" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#3B0764">api-gateway</text>
  <text x="672" y="327" text-anchor="middle" font-size="13" fill="#5B21B6">GraphQL · poster GET</text>
  <rect x="627" y="339" width="90" height="24" rx="12" fill="#8B5CF6"/>
  <text x="672" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">:8080</text>
  <text x="672" y="384" text-anchor="middle" font-size="11.5" fill="#6D28D9">limits · error codes</text>
  <text x="672" y="400" text-anchor="middle" font-size="11.5" fill="#6D28D9">batched name lookup</text>

  <!-- gateway → services (gRPC) -->
  <path d="M772 290 C820 290 830 222 872 222" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-grpc)"/>
  <path d="M772 350 C820 350 830 448 872 448" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-grpc)"/>
  <text x="812" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#6D28D9">gRPC</text>
  <text x="812" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#6D28D9">gRPC</text>

  <!-- movie-service -->
  <g filter="url(#shadow)">
    <rect x="878" y="166" width="206" height="150" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  </g>
  <rect x="962" y="181" width="38" height="26" rx="4" fill="#F97316"/>
  <g fill="#FFF7ED">
    <rect x="966" y="184" width="5" height="4" rx="1"/><rect x="976" y="184" width="5" height="4" rx="1"/><rect x="986" y="184" width="5" height="4" rx="1"/>
    <rect x="966" y="200" width="5" height="4" rx="1"/><rect x="976" y="200" width="5" height="4" rx="1"/><rect x="986" y="200" width="5" height="4" rx="1"/>
  </g>
  <text x="981" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#7C2D12">movie-service</text>
  <text x="981" y="255" text-anchor="middle" font-size="13" fill="#9A3412">movies · credits · artwork</text>
  <rect x="926" y="267" width="110" height="24" rx="12" fill="#F97316"/>
  <text x="981" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">gRPC :9091</text>
  <text x="981" y="306" text-anchor="middle" font-size="11.5" fill="#C2410C">health :8081</text>

  <!-- people-service -->
  <g filter="url(#shadow)">
    <rect x="878" y="388" width="206" height="150" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <circle cx="972" cy="408" r="7" fill="#2563EB"/>
  <path d="M960 431 C960 420 965 417 972 417 C979 417 984 420 984 431 Z" fill="#2563EB"/>
  <circle cx="992" cy="410" r="6" fill="#60A5FA"/>
  <path d="M982 431 C982 422 986 419 992 419 C998 419 1002 422 1002 431 Z" fill="#60A5FA"/>
  <text x="981" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">people-service</text>
  <text x="981" y="479" text-anchor="middle" font-size="13" fill="#1D4ED8">people</text>
  <rect x="926" y="490" width="110" height="24" rx="12" fill="#3B82F6"/>
  <text x="981" y="507" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">gRPC :9092</text>
  <text x="981" y="529" text-anchor="middle" font-size="11.5" fill="#1D4ED8">health :8082</text>

  <!-- people → movie: credit check -->
  <line x1="981" y1="388" x2="981" y2="322" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-grpc)"/>
  <rect x="992" y="341" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="1048" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#6D28D9">credit check</text>

  <!-- stores -->
  <g stroke="#94A3B8" stroke-width="2">
    <line x1="1084" y1="206" x2="1124" y2="206"/>
    <line x1="1084" y1="276" x2="1124" y2="276"/>
    <line x1="1084" y1="463" x2="1124" y2="463"/>
  </g>
  <!-- movie DB -->
  <path d="M1126 186 v38 a52 10 0 0 0 104 0 v-38" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="1178" cy="186" rx="52" ry="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="1178" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">H2 · movie-db</text>
  <text x="1178" y="228" text-anchor="middle" font-size="11" fill="#475569">Liquibase</text>
  <!-- artwork files -->
  <path d="M1126 256 h34 l8 8 h62 v34 a4 4 0 0 1 -4 4 h-96 a4 4 0 0 1 -4 -4 z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="1178" y="283" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350F">poster files</text>
  <text x="1178" y="297" text-anchor="middle" font-size="11" fill="#92400E">data/artwork</text>
  <!-- people DB -->
  <path d="M1126 443 v38 a52 10 0 0 0 104 0 v-38" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="1178" cy="443" rx="52" ry="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="1178" y="470" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">H2 · people-db</text>
  <text x="1178" y="485" text-anchor="middle" font-size="11" fill="#475569">Liquibase</text>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <line x1="40" y1="604" x2="84" y2="604" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-http)"/>
    <text x="96" y="609">HTTP (GraphQL, poster images)</text>
    <line x1="330" y1="604" x2="374" y2="604" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-grpc)"/>
    <text x="386" y="609">gRPC (protobuf contracts)</text>
    <text x="600" y="609" fill="#64748B">The browser only talks to the gateway · services only talk gRPC · each service owns its data</text>
  </g>
</svg>
