server {
    listen 80;
    root /usr/share/nginx/html;

    # The gateway enforces the real limits (6 MB file, 7 MB request); this only lets a 5 MiB upload through.
    client_max_body_size 8m;

    location /graphql {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /artwork/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
    }
    # Single-page app: every other path serves index.html and the browser router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
