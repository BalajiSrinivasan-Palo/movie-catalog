syntax = "proto3";

package moviecatalog.movie.v1;

import "google/protobuf/timestamp.proto";
import "moviecatalog/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.moviecatalog.contracts.movie.v1";

// Owns movies, artwork and credits (ADR-001, ADR-003).
// Person data is NOT owned here: credits hold person_id only (BR-06).
// Update calls use full-replacement semantics (PUT): all input fields are applied.
// All calls must be made with a deadline; the gateway sets one per call.
service MovieService {
  // Errors: INVALID_ARGUMENT (validation), ALREADY_EXISTS (movie.duplicate).
  rpc CreateMovie(CreateMovieRequest) returns (Movie);
  // Errors: NOT_FOUND.
  rpc GetMovie(GetMovieRequest) returns (Movie);
  // Errors: NOT_FOUND, INVALID_ARGUMENT, ALREADY_EXISTS.
  rpc UpdateMovie(UpdateMovieRequest) returns (Movie);
  // Deletes the movie, its credits and its artwork files (BR-03).
  // Errors: NOT_FOUND.
  rpc DeleteMovie(DeleteMovieRequest) returns (DeleteMovieResponse);
  // Errors: INVALID_ARGUMENT (paging, sort, filter; field "genres" with movie.genres.invalid for more
  // than 15, duplicate or unknown genres).
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse);
  // Case-insensitive substring match; wildcards are literal (D9, EC-12).
  // Errors: INVALID_ARGUMENT (search.query.invalid).
  rpc SearchMovies(SearchMoviesRequest) returns (ListMoviesResponse);

  // Client-streaming upload: first message is metadata, the rest are chunks.
  // The server enforces size while receiving, validates by content (BR-08),
  // writes to a temporary file, and only then commits (BR-11).
  // Errors: NOT_FOUND, INVALID_ARGUMENT (artwork.*), CANCELLED, DEADLINE_EXCEEDED.
  rpc UploadArtwork(stream UploadArtworkRequest) returns (ArtworkInfo);
  // Errors: NOT_FOUND (movie or artwork).
  rpc RemoveArtwork(RemoveArtworkRequest) returns (RemoveArtworkResponse);
  // Server-streaming download: first message is the header, then chunks.
  // Errors: NOT_FOUND.
  rpc DownloadArtwork(DownloadArtworkRequest) returns (stream DownloadArtworkResponse);

  // Errors: NOT_FOUND (movie), INVALID_ARGUMENT, ALREADY_EXISTS (credit.duplicate).
  // Person existence is validated by the gateway before this call (ADR-003).
  rpc AddCredit(AddCreditRequest) returns (Credit);
  // Errors: NOT_FOUND, INVALID_ARGUMENT, ALREADY_EXISTS.
  rpc UpdateCredit(UpdateCreditRequest) returns (Credit);
  // Errors: NOT_FOUND.
  rpc RemoveCredit(RemoveCreditRequest) returns (RemoveCreditResponse);
  // Returns up to `limit` credits (max 200) plus the total (EC-14).
  // Ordered by role (ACTOR, DIRECTOR, WRITER, PRODUCER), then creation time, then id.
  rpc ListCreditsByMovie(ListCreditsByMovieRequest) returns (ListCreditsByMovieResponse);
  // Filmography of one person, with movie summaries (FR-PPL-05).
  // Ordered by release year descending (newest movie first), then title, then role (decision D20).
  rpc ListCreditsByPerson(ListCreditsByPersonRequest) returns (ListCreditsByPersonResponse);
  // Used by people-service before deleting a person (D8, FR-PPL-04).
  // Invalid person_id format: INVALID_ARGUMENT (id.invalid).
  rpc CheckPersonCredits(CheckPersonCreditsRequest) returns (CheckPersonCreditsResponse);
}

enum Genre {
  GENRE_UNSPECIFIED = 0;
  GENRE_ACTION = 1;
  GENRE_ADVENTURE = 2;
  GENRE_ANIMATION = 3;
  GENRE_COMEDY = 4;
  GENRE_CRIME = 5;
  GENRE_DOCUMENTARY = 6;
  GENRE_DRAMA = 7;
  GENRE_FANTASY = 8;
  GENRE_HORROR = 9;
  GENRE_MYSTERY = 10;
  GENRE_ROMANCE = 11;
  GENRE_SCI_FI = 12;
  GENRE_THRILLER = 13;
  GENRE_WAR = 14;
  GENRE_WESTERN = 15;
}

enum CreditRole {
  CREDIT_ROLE_UNSPECIFIED = 0;
  CREDIT_ROLE_ACTOR = 1;
  CREDIT_ROLE_DIRECTOR = 2;
  CREDIT_ROLE_WRITER = 3;
  CREDIT_ROLE_PRODUCER = 4;
}

enum ArtworkVariant {
  ARTWORK_VARIANT_UNSPECIFIED = 0; // treated as ORIGINAL
  ARTWORK_VARIANT_ORIGINAL = 1;
  ARTWORK_VARIANT_THUMBNAIL = 2;
}

enum MovieSortField {
  MOVIE_SORT_FIELD_UNSPECIFIED = 0; // server default: title
  MOVIE_SORT_FIELD_TITLE = 1;
  MOVIE_SORT_FIELD_RELEASE_YEAR = 2;
}

message Movie {
  string id = 1;
  string title = 2;
  int32 release_year = 3;
  optional int32 runtime_minutes = 4;
  string synopsis = 5;
  repeated Genre genres = 6;
  optional ArtworkInfo artwork = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int32 credit_count = 10;
}

message MovieSummary {
  string id = 1;
  string title = 2;
  int32 release_year = 3;
  bool has_artwork = 4;
  string artwork_version = 5; // cache-busting token, empty when no artwork
}

message ArtworkInfo {
  string id = 1;
  string content_type = 2; // detected, one of image/jpeg, image/png, image/webp
  int64 size_bytes = 3;
  int32 width = 4;
  int32 height = 5;
  string version = 6;      // changes on every replace; used in image URLs
}

message MovieInput {
  string title = 1;
  int32 release_year = 2;
  optional int32 runtime_minutes = 3;
  string synopsis = 4;
  repeated Genre genres = 5;
}

message CreateMovieRequest { MovieInput input = 1; }
message GetMovieRequest { string id = 1; }
message UpdateMovieRequest {
  string id = 1;
  MovieInput input = 2;
}
message DeleteMovieRequest { string id = 1; }
message DeleteMovieResponse { string id = 1; }

message ListMoviesRequest {
  moviecatalog.common.v1.PageRequest page = 1;
  MovieSortField sort_field = 2;
  moviecatalog.common.v1.SortDirection sort_direction = 3;
  optional Genre genre = 4;     // kept for older clients; combined with `genres` (ADR-015)
  optional int32 year_from = 5; // inclusive; equal to year_to for a single year
  optional int32 year_to = 6;   // inclusive
  // A movie matches when it has ANY of these genres (S-702, ADR-015). Empty means no genre filter.
  // At most 15, no duplicates, no unspecified or unknown values.
  repeated Genre genres = 7;
}

message ListMoviesResponse {
  repeated Movie movies = 1;
  moviecatalog.common.v1.PageInfo page_info = 2;
}

message SearchMoviesRequest {
  string query = 1;
  moviecatalog.common.v1.PageRequest page = 2;
}

message ArtworkMetadata {
  string movie_id = 1;
  // Informational only. The server NEVER trusts these two values (BR-08).
  string declared_content_type = 2;
  int64 declared_size_bytes = 3;
}

message UploadArtworkRequest {
  oneof payload {
    ArtworkMetadata metadata = 1; // must be the first message, exactly once
    bytes chunk = 2;              // recommended chunk size 64 KiB
  }
}

message RemoveArtworkRequest { string movie_id = 1; }
message RemoveArtworkResponse { string movie_id = 1; }

message DownloadArtworkRequest {
  string movie_id = 1;
  ArtworkVariant variant = 2;
}

message ArtworkFileHeader {
  string content_type = 1;
  int64 size_bytes = 2;
  string version = 3;
}

message DownloadArtworkResponse {
  oneof payload {
    ArtworkFileHeader header = 1; // first message
    bytes chunk = 2;
  }
}

message Credit {
  string id = 1;
  string movie_id = 2;
  string person_id = 3;
  CreditRole role = 4;
  optional string character_name = 5; // only valid for ACTOR
}

message AddCreditRequest {
  string movie_id = 1;
  string person_id = 2;
  CreditRole role = 3;
  optional string character_name = 4;
}

message UpdateCreditRequest {
  string credit_id = 1;
  CreditRole role = 2;
  optional string character_name = 3;
}

message RemoveCreditRequest { string credit_id = 1; }
message RemoveCreditResponse { string credit_id = 1; }

message ListCreditsByMovieRequest {
  string movie_id = 1;
  int32 limit = 2; // 1..200, default 200
}

message ListCreditsByMovieResponse {
  repeated Credit credits = 1;
  int32 total = 2;      // total credits for the movie
  bool truncated = 3;   // true when total > credits.size()
}

message ListCreditsByPersonRequest {
  string person_id = 1;
  moviecatalog.common.v1.PageRequest page = 2;
}

message CreditWithMovie {
  Credit credit = 1;
  MovieSummary movie = 2;
}

message ListCreditsByPersonResponse {
  repeated CreditWithMovie credits = 1;
  moviecatalog.common.v1.PageInfo page_info = 2;
}

message CheckPersonCreditsRequest {
  string person_id = 1;
  int32 max_movies = 2; // 1..10, default 10
}

message CheckPersonCreditsResponse {
  int64 credit_count = 1;
  repeated MovieSummary blocking_movies = 2; // at most max_movies distinct movies
}
