  <text x="40" y="380" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">2 · ONE PIPELINE PER STORY: ONE AGENT PER STEP, THE OWNER BETWEEN STEPS (story-workflow skill, D26)</text>
